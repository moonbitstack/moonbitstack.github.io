name: catalogue

# The page already takes its versions from mooncakes at build time, so it is
# never stale. This is what stops the files behind it from drifting: a version
# that moved on, or a repository in the organisation that no entry names. One
# pull request, reused, so a month of releases is one review.
on:
  repository_dispatch:
    types: [released]
  schedule:
    - cron: "10 4 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: take what the registry and the organisation say
        run: node scripts/catalogue.mjs

      - name: open or update the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/versions.json src/data/packages.ts; then
            echo "nothing moved"; exit 0
          fi
          # Only those two may change, and the catalogue only by growing: the
          # script appends a new entry and never edits one.
          if [ -n "$(git diff --name-only -- . ':!src/data/versions.json' ':!src/data/packages.ts')" ]; then
            echo "::error::something outside the catalogue changed"; git diff --stat; exit 1
          fi
          if [ -n "$(git diff -U0 -- src/data/packages.ts | grep -E '^-[^-]')" ]; then
            echo "::error::the catalogue lost a line"; git diff -- src/data/packages.ts; exit 1
          fi
          git config user.name "moonbitstack-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B bot/versions
          git commit -sm "chore(site): follow the registry and the organisation." -- src/data/versions.json src/data/packages.ts
          git push --force origin bot/versions
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          if [ -z "$(gh pr list --head bot/versions --state open --json number --jq '.[].number')" ]; then
            gh pr create --head bot/versions --base main \
              --title "chore(site): follow the registry and the organisation." \
              --body "$(git show --stat --oneline HEAD | tail -n +2)"
          fi

      # Merged without a person only when it is provably this workflow's own:
      # opened by the Actions bot from a branch of this repository (never a
      # fork), every commit by the bot account above, nothing touched but the
      # two catalogue files, and the catalogue only growing. Anything else
      # stays open for review.
      - name: merge it when it is ours
        # Only right after this run pushed: an older pull request still open
        # would carry older versions, and merging it would roll the catalogue back.
        if: steps.pr.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head bot/versions --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "no open pull request"; exit 0; }
          view=$(gh pr view "$pr" --json author,headRepository,headRepositoryOwner,files,commits)
          author=$(echo "$view" | jq -r '.author.login')
          owner=$(echo "$view" | jq -r '.headRepositoryOwner.login')
          repo=$(echo "$view" | jq -r '.headRepository.name')
          if [ "$author" != "app/github-actions" ] && [ "$author" != "github-actions" ]; then
            echo "opened by $author, left for review"; exit 0
          fi
          if [ "$owner/$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "head is $owner/$repo, not this repository; left for review"; exit 0
          fi
          others=$(echo "$view" | jq -r '.files[].path' | grep -vxE 'src/data/versions\.json|src/data/packages\.ts' || true)
          if [ -n "$others" ]; then
            echo "touches $others; left for review"; exit 0
          fi
          strangers=$(echo "$view" | jq -r '.commits[].authors[].email' | grep -vx 'bot@users.noreply.github.com' || true)
          if [ -n "$strangers" ]; then
            echo "commits by $strangers; left for review"; exit 0
          fi
          if gh pr diff "$pr" | awk '/^diff --git/ { on = ($0 ~ /src\/data\/packages\.ts/) } on' | grep -qE '^-[^-]'; then
            echo "the catalogue lost a line; left for review"; exit 0
          fi
          gh pr merge "$pr" --squash --delete-branch
          # A merge made with this token fires no push event, so start the
          # deploy explicitly.
          gh workflow run pages.yml --ref main
