name: pages

# A release in any module repository sends `released` here, which rebuilds the
# page with the version mooncakes now reports. The half-monthly run is the
# fallback for a release that could not send one.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [released]
  schedule:
    - cron: "40 3 1,16 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      # Nothing is committed back here: the page is built from what the
      # registry says right now, and a registry that is down costs freshness
      # and not a red pipeline. `versions.yml` is what makes the files catch up.
      - run: node scripts/catalogue.mjs
      - run: npx astro check
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
